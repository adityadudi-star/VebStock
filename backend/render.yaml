# Render Blueprint for the VebStock API. Root directory = backend/.
# Secrets are NOT committed: DATABASE_URL is wired from the managed database; CORS_ORIGINS is set in the dashboard.
services:
  - type: web
    name: vebstock-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vebstock-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false            # e.g. https://your-app.vercel.app  (set in the Render dashboard)
      - key: CORS_ORIGIN_REGEX
        sync: false            # optional, for Vercel previews: https://your-app-.*\.vercel\.app
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: vebstock-db
    databaseName: vebstock
    plan: free
